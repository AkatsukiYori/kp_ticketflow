version: "3.9"

services:
  laravel_app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ticketflow_app
    ports:
      - "8000:8000"
      - "5173:5173"
    depends_on:
      - laravel_db
    volumes:
      - .:/var/www
    networks:
      - laravel

  laravel_db:
    image: mysql:8.4
    container_name: ticketflow_db
    restart: always
    environment:
      MYSQL_DATABASE: db_kp_ticketflow
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    networks:
      - laravel

networks:
  laravel:
    driver: bridge

volumes:
  mysqldata: